<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lチカのつづき | Maker Intent Transformer</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1e2528;
        --muted: #687174;
        --line: #d7dedf;
        --paper: #f7f5ef;
        --panel: #ffffff;
        --accent: #0f766e;
        --accent-2: #c2410c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      main {
        max-width: 1060px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      header {
        display: grid;
        gap: 10px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 48px);
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.9fr);
        gap: 18px;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 18px;
        letter-spacing: 0;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }

      textarea,
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        padding: 12px;
      }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 120px;
        gap: 10px;
        margin-top: 12px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      pre {
        min-height: 360px;
        overflow: auto;
        margin: 0;
        padding: 14px;
        border-radius: 8px;
        background: #172022;
        color: #d8f3ef;
        font-size: 13px;
        line-height: 1.55;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent-2);
      }

      .dot.ready {
        background: var(--accent);
      }

      @media (max-width: 820px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Lチカのつづき</h1>
        <p>Maker Intent Transformer と Project Graph Transformer の学習済みチェックポイントを使って、曖昧な制作意図から作品候補と作品グラフを生成します。</p>
      </header>

      <div class="workspace">
        <section>
          <h2>Intent</h2>
          <label for="intent">制作意図</label>
          <textarea id="intent">作りたいものは分からない。予算は5000円。かわいいものがいい。ESP32は持っている。</textarea>
          <div class="row">
            <input id="topK" type="number" min="1" max="5" value="3" aria-label="top k" />
            <button id="run">推論</button>
          </div>
          <div class="status">
            <span class="dot" id="dot"></span>
            <span id="status">checkpoint 未確認</span>
          </div>
        </section>

        <section>
          <h2>Transformer Output</h2>
          <pre id="output">{}</pre>
        </section>
      </div>
    </main>

    <script>
      const button = document.querySelector("#run");
      const output = document.querySelector("#output");
      const statusText = document.querySelector("#status");
      const dot = document.querySelector("#dot");

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        return response.json();
      }

      async function runInference() {
        button.disabled = true;
        statusText.textContent = "推論中";
        try {
          const request = {
            text: document.querySelector("#intent").value,
            topK: Number(document.querySelector("#topK").value || 3),
          };
          const [intent, projectGraph, bom, skillrec, wirecheck, neuralAgents] = await Promise.all([
            postJson("/api/ai/intent/transformer", request),
            postJson("/api/ai/project-graph/transformer", request),
            postJson("/api/ai/bom/estimator", request),
            postJson("/api/ai/skillrec", {}),
            postJson("/api/ai/wirechecknet", { synthetic: true }),
            postJson("/api/ai/neural-agents", request),
          ]);
          const data = { intent, projectGraph, bom, skillrec, wirecheck, neuralAgents };
          output.textContent = JSON.stringify(data, null, 2);
          dot.classList.toggle("ready", Boolean(intent.available || projectGraph.available || bom.available || skillrec.available || wirecheck.available || neuralAgents.available));
          statusText.textContent = intent.available || projectGraph.available || bom.available || skillrec.available || wirecheck.available || neuralAgents.available ? "checkpoint loaded" : "checkpoint not loaded";
        } catch (error) {
          output.textContent = String(error);
          dot.classList.remove("ready");
          statusText.textContent = "request failed";
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener("click", runInference);
      runInference();
    </script>
  </body>
</html>
