<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lチカのつづき</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f5;
        --panel: #ffffff;
        --ink: #172426;
        --muted: #637074;
        --line: #d9dfdc;
        --accent: #0f766e;
        --accent-weak: #e1f3f0;
        --blue: #1d4ed8;
        --blue-weak: #e7efff;
        --warn: #a16207;
        --warn-weak: #fff7db;
        --danger: #b91c1c;
        --danger-weak: #fee2e2;
        --code: #132024;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 1360px;
        margin: 0 auto;
        padding: 22px;
      }

      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: end;
        margin-bottom: 16px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 32px;
        letter-spacing: 0;
      }

      h2 {
        font-size: 18px;
        letter-spacing: 0;
      }

      h3 {
        font-size: 15px;
        letter-spacing: 0;
      }

      .subtitle {
        margin-top: 6px;
        color: var(--muted);
        line-height: 1.55;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 190px;
        justify-content: flex-end;
        color: var(--muted);
        font-size: 14px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--warn);
      }

      .dot.ready {
        background: var(--accent);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 0.78fr) minmax(0, 1.22fr);
        gap: 14px;
      }

      .panel,
      .result-block,
      .project-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .panel {
        padding: 16px;
        align-self: start;
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-weight: 750;
      }

      textarea,
      select,
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 11px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      textarea {
        min-height: 116px;
        resize: vertical;
        line-height: 1.55;
      }

      .compact textarea {
        min-height: 74px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 8px 11px;
        cursor: pointer;
        font-size: 14px;
      }

      .chip.active {
        border-color: var(--accent);
        background: var(--accent-weak);
        color: #0f4f4a;
        font-weight: 750;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }

      button.primary,
      button.secondary {
        border-radius: 8px;
        padding: 11px 16px;
        font-weight: 800;
        cursor: pointer;
      }

      button.primary {
        border: 0;
        color: #fff;
        background: var(--accent);
      }

      button.secondary {
        border: 1px solid var(--line);
        color: var(--ink);
        background: #fff;
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .help-button {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 1200;
        width: 76px;
        height: 76px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        box-shadow: 0 16px 34px rgba(15, 118, 110, 0.32);
        font-size: 42px;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
      }

      .help-button span {
        display: block;
        transform: translateY(-1px);
      }

      .guide-overlay.hidden {
        display: none;
      }

      .guide-backdrop {
        position: fixed;
        inset: 0;
        z-index: 900;
        background: rgba(18, 28, 31, 0.48);
        pointer-events: none;
      }

      .guide-card {
        position: fixed;
        z-index: 1120;
        width: min(360px, calc(100vw - 32px));
        border: 1px solid #b7d8d3;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(12, 20, 24, 0.24);
        padding: 15px;
        pointer-events: auto;
      }

      .guide-card h3 {
        margin-top: 6px;
        font-size: 18px;
      }

      .guide-card p {
        margin-top: 8px;
        color: var(--muted);
        line-height: 1.6;
      }

      .guide-step-label {
        color: #0f4f4a;
        font-size: 12px;
        font-weight: 850;
      }

      .guide-example {
        margin-top: 10px;
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        background: var(--accent-weak);
        padding: 10px;
        color: #0f4f4a;
        font-size: 14px;
        line-height: 1.55;
      }

      .guide-actions {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        gap: 8px;
        align-items: center;
        margin-top: 13px;
      }

      .guide-actions button {
        border-radius: 8px;
        padding: 9px 11px;
        font-weight: 800;
        cursor: pointer;
      }

      .guide-actions .ghost {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
      }

      .guide-actions .fill {
        border: 1px solid var(--accent);
        background: var(--accent-weak);
        color: #0f4f4a;
      }

      .guide-actions .next {
        border: 0;
        background: var(--accent);
        color: #fff;
      }

      .guide-cursor {
        position: fixed;
        z-index: 1110;
        width: 68px;
        height: 86px;
        background: #ffffff;
        clip-path: polygon(0 0, 0 78%, 23% 60%, 39% 100%, 57% 92%, 42% 55%, 78% 55%);
        filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.9)) drop-shadow(0 14px 24px rgba(0, 0, 0, 0.26));
        transform: translate(20px, 20px);
        transition: transform 0.34s ease;
        pointer-events: none;
      }

      .guide-pulse {
        position: fixed;
        z-index: 1095;
        width: 44px;
        height: 44px;
        border: 3px solid rgba(15, 118, 110, 0.72);
        border-radius: 50%;
        transform: translate(20px, 20px);
        animation: guidePulse 1.3s ease-in-out infinite;
        pointer-events: none;
      }

      .guide-speech {
        position: fixed;
        z-index: 1116;
        max-width: min(300px, calc(100vw - 32px));
        border: 1px solid #b7d8d3;
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink);
        box-shadow: 0 16px 38px rgba(12, 20, 24, 0.2);
        padding: 12px 13px;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.55;
        pointer-events: none;
      }

      .guide-speech::after {
        content: "";
        position: absolute;
        left: 18px;
        bottom: -10px;
        width: 18px;
        height: 18px;
        border-right: 1px solid #b7d8d3;
        border-bottom: 1px solid #b7d8d3;
        background: #ffffff;
        transform: rotate(45deg);
      }

      @keyframes guidePulse {
        0% {
          opacity: 0.95;
          scale: 0.78;
        }
        100% {
          opacity: 0;
          scale: 1.65;
        }
      }

      .guide-highlight {
        position: relative;
        z-index: 1050;
        outline: 4px solid rgba(15, 118, 110, 0.9);
        outline-offset: 4px;
        box-shadow: 0 0 0 9999px rgba(18, 28, 31, 0.18), 0 0 28px rgba(15, 118, 110, 0.68);
      }

      .progress {
        color: var(--muted);
        font-size: 14px;
      }

      .result-grid {
        display: grid;
        gap: 12px;
      }

      .result-block {
        padding: 14px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }

      .project-card {
        padding: 13px;
        display: grid;
        gap: 8px;
        min-height: 132px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 9px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 5px 8px;
        background: #eef1f1;
        color: #3d4a4d;
        font-size: 12px;
        font-weight: 750;
      }

      .pill.good {
        background: var(--accent-weak);
        color: #0f4f4a;
      }

      .pill.info {
        background: var(--blue-weak);
        color: var(--blue);
      }

      .pill.warn {
        background: var(--warn-weak);
        color: var(--warn);
      }

      .pill.danger {
        background: var(--danger-weak);
        color: var(--danger);
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .kv {
        display: grid;
        gap: 7px;
        margin-top: 10px;
      }

      .kv div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid #edf0f0;
        padding-bottom: 7px;
        color: var(--muted);
        font-size: 14px;
      }

      .kv strong {
        color: var(--ink);
        text-align: right;
      }

      .answer-panel {
        display: grid;
        gap: 9px;
        margin-top: 12px;
        padding: 12px;
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        background: #f3fbf9;
      }

      .section-label {
        color: #0f4f4a;
        font-size: 12px;
        font-weight: 850;
      }

      .answer-question {
        color: var(--ink);
        font-weight: 850;
        line-height: 1.55;
      }

      .answer-box {
        min-height: 72px;
        background: #fff;
      }

      .answer-tools {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
      }

      .answer-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip.small {
        padding: 6px 9px;
        font-size: 13px;
      }

      .answer-submit {
        white-space: nowrap;
      }

      .hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .timeline {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .step {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 10px;
        align-items: start;
      }

      .num {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--accent-weak);
        color: #0f4f4a;
        font-weight: 850;
        font-size: 13px;
      }

      ul {
        margin: 9px 0 0;
        padding-left: 19px;
        color: var(--muted);
        line-height: 1.55;
      }

      pre {
        margin: 10px 0 0;
        max-height: 430px;
        overflow: auto;
        border-radius: 8px;
        padding: 13px;
        background: var(--code);
        color: #d9f5ee;
        font-size: 13px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .empty {
        color: var(--muted);
        line-height: 1.7;
      }

      @media (max-width: 980px) {
        header,
        .layout,
        .two-col,
        .cards {
          grid-template-columns: 1fr;
        }

        .answer-tools {
          grid-template-columns: 1fr;
        }

        .answer-submit {
          width: 100%;
        }

        .help-button {
          right: 16px;
          bottom: 16px;
          width: 68px;
          height: 68px;
          font-size: 38px;
        }

        .guide-actions {
          grid-template-columns: 1fr 1fr;
        }

        .guide-actions .fill {
          grid-column: span 2;
        }

        .status {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Lチカのつづき</h1>
          <p class="subtitle">気分・予算・持ち物・詰まり具合から、作るもの、買うもの、配線、コード、次の一手までつなぎます。</p>
        </div>
        <div class="status">
          <span class="dot" id="dot"></span>
          <span id="statusText">起動中</span>
        </div>
      </header>

      <div class="layout">
        <section class="panel stack">
          <div>
            <label for="intent">今の状態</label>
            <textarea id="intent">作りたいものはまだ決まっていない。予算は5000円。かわいいものがいい。ESP32とLEDと抵抗とブレッドボードがあります。</textarea>
          </div>

          <div>
            <label>入り口</label>
            <div class="chips" id="entryChips">
              <button class="chip active" data-text="かわいいものを作りたい">かわいい</button>
              <button class="chip" data-text="生活の困りごとを解決したい">困りごと</button>
              <button class="chip" data-text="予算5000円で作りたい">予算から</button>
              <button class="chip" data-text="持っている部品から作りたい">持ち物から</button>
              <button class="chip" data-text="Lチカの次に進みたい">Lチカの次</button>
            </div>
          </div>

          <div class="form-grid">
            <div>
              <label for="budget">予算</label>
              <select id="budget">
                <option value="1000">1,000円以内</option>
                <option value="3000">3,000円以内</option>
                <option value="5000" selected>5,000円以内</option>
                <option value="10000">10,000円以内</option>
                <option value="20000">20,000円以内</option>
              </select>
            </div>
            <div>
              <label for="board">ボード</label>
              <select id="board">
                <option value="esp32" selected>ESP32</option>
                <option value="arduino_uno">Arduino Uno</option>
                <option value="m5stack">M5Stack</option>
                <option value="pico">Raspberry Pi Pico</option>
              </select>
            </div>
          </div>

          <div class="compact">
            <label for="inventory">持っている部品</label>
            <textarea id="inventory">ESP32, LED, 220Ω抵抗, ブレッドボード, ジャンパ線, USBケーブル</textarea>
          </div>

          <div class="form-grid">
            <div>
              <label for="stage">今の段階</label>
              <select id="stage">
                <option value="orient" selected>まだ選んでいる</option>
                <option value="parts_check">部品確認中</option>
                <option value="minimal_circuit">最小回路を組む</option>
                <option value="firmware_upload">コードを書き込む</option>
                <option value="observe_serial">ログを見る</option>
                <option value="debug_triage">動かない</option>
                <option value="standard_build">標準版へ進む</option>
                <option value="extension">拡張したい</option>
              </select>
            </div>
            <div>
              <label for="symptom">症状</label>
              <select id="symptom">
                <option value="none" selected>まだない</option>
                <option value="led_not_lighting">LEDが光らない</option>
                <option value="upload_failed">書き込めない</option>
                <option value="sensor_static">センサー値が変わらない</option>
                <option value="app_stuck_after_checkpoint">checkpoint loadedで止まる</option>
              </select>
            </div>
          </div>

          <div class="actions">
            <div class="progress" id="progress">入力して実行できます</div>
            <button class="primary" id="runButton">生成する</button>
          </div>
        </section>

        <section class="result-grid">
          <div class="result-block">
            <h2>おすすめ作品</h2>
            <div id="projects" class="cards">
              <p class="empty">まだ生成していません。</p>
            </div>
          </div>

          <div class="result-block">
            <h2>自律チュートリアル</h2>
            <div id="tutorial" class="empty">ニューラル分類で次の一手を出します。</div>
          </div>

          <div class="two-col">
            <div class="result-block">
              <h2>ニューラル分類</h2>
              <div id="neural" class="empty">待機中</div>
            </div>
            <div class="result-block">
              <h2>予算と部品</h2>
              <div id="bom" class="empty">待機中</div>
            </div>
          </div>

          <div class="result-block">
            <h2>生成コード</h2>
            <div id="firmwareMeta" class="empty">待機中</div>
            <pre id="code">// ここに確認用コードが出ます</pre>
          </div>

          <div class="two-col">
            <div class="result-block">
              <h2>デバッグ判断</h2>
              <div id="debug" class="empty">待機中</div>
            </div>
            <div class="result-block">
              <h2>安全判断</h2>
              <div id="safety" class="empty">待機中</div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <button class="help-button" id="helpButton" type="button" aria-label="使い方を開く">
      <span>?</span>
    </button>

    <div class="guide-overlay hidden" id="guideOverlay" aria-hidden="true">
      <div class="guide-backdrop"></div>
      <div class="guide-cursor" id="guideCursor"></div>
      <div class="guide-pulse" id="guidePulse"></div>
      <div class="guide-speech" id="guideSpeech">ここから始めます。</div>
      <section class="guide-card" id="guideCard" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
        <span class="guide-step-label" id="guideCount">1 / 8</span>
        <h3 id="guideTitle">使い方</h3>
        <p id="guideText"></p>
        <div class="guide-example" id="guideExample"></div>
        <div class="guide-actions">
          <button class="ghost" type="button" id="guideCloseButton">閉じる</button>
          <button class="ghost" type="button" id="guidePrevButton">戻る</button>
          <button class="fill" type="button" id="guideFillButton">入力例を入れる</button>
          <button class="next" type="button" id="guideNextButton">次へ</button>
        </div>
      </section>
    </div>

    <script>
      const API_BASE = window.API_BASE || localStorage.getItem("DENSHI_API_BASE") || "";
      const PROJECT_LABELS = {
        light_charm: "暗くなると光る小さなお守り",
        desk_pet: "近づくと鳴く机上ペット",
        plant_ping: "水やり通知",
        posture_guard: "姿勢注意デバイス",
        temp_face: "温度で表情が変わるミニキャラ",
      };

      const state = {
        selectedEntry: "かわいいものを作りたい",
        selectedProject: "desk_pet",
        latest: null,
        latestQuestion: "",
        guideStep: 0,
        activeGuideTarget: null,
      };

      const GUIDE_STEPS = [
        {
          id: "intent",
          selector: "#intent",
          title: "まず、今の状態を書く",
          text: "作りたいものが決まっていなくても大丈夫です。気分、予算、持っている部品をそのまま入れると候補が出やすくなります。",
          example: "作りたいものはまだ決まっていない。予算は5000円。かわいいものがいい。ESP32とLEDがあります。",
          bubble: "ここに、いまの状況を文章で入れます。",
        },
        {
          id: "entry",
          selector: "#entryChips",
          title: "入口をひとつ選ぶ",
          text: "迷っているときは「かわいい」「困りごと」「Lチカの次」から選びます。ここで作品の方向性が決まります。",
          example: "例: かわいい",
          bubble: "迷ったら、まずはこの入口をひとつ選びます。",
        },
        {
          id: "budget",
          selector: "#budget",
          title: "予算を選ぶ",
          text: "部品代は範囲で見積もります。迷うなら5,000円以内が、初心者の最初の作品にちょうどいいです。",
          example: "例: 5,000円以内",
          bubble: "ここで買える範囲を決めます。",
        },
        {
          id: "board",
          selector: "#board",
          title: "使うボードを選ぶ",
          text: "ESP32、Arduino、M5Stackなど、手元にあるものを選びます。コード生成とピン割り当てに使います。",
          example: "例: ESP32",
          bubble: "持っているマイコンを選びます。",
        },
        {
          id: "inventory",
          selector: "#inventory",
          title: "持っている部品を書く",
          text: "正確でなくても大丈夫です。LED、抵抗、ブレッドボード、USBケーブルのように分かる範囲で並べます。",
          example: "ESP32, LED, 220Ω抵抗, ブレッドボード, ジャンパ線, USBケーブル",
          bubble: "部品名をカンマ区切りで入れます。",
        },
        {
          id: "stage",
          selector: "#stage",
          title: "今の段階を選ぶ",
          text: "まだ探しているのか、配線中なのか、動かなくて困っているのかを選ぶと、次の一手が変わります。",
          example: "例: まだ選んでいる",
          bubble: "いま作業がどこまで進んでいるかを選びます。",
        },
        {
          id: "symptom",
          selector: "#symptom",
          title: "困っている症状を選ぶ",
          text: "動かない場合だけ選びます。まだ困っていなければ「まだない」のままで進めます。",
          example: "例: LEDが光らない / まだない",
          bubble: "困っている時だけ症状を選びます。",
        },
        {
          id: "run",
          selector: "#runButton",
          title: "生成する",
          text: "ここを押すと、作品候補、予算、部品、チュートリアル、コード、デバッグ判断までまとめて生成します。",
          example: "押すだけで開始します。",
          bubble: "入力できたら、このボタンで生成します。",
        },
        {
          id: "answer",
          selector: "#answerBox",
          fallback: "#tutorial",
          title: "次の質問に答える",
          text: "生成後は、自律チュートリアルの質問に答えます。回答すると左の「今の状態」に追記され、次の手順へ進みます。",
          example: "例: LEDはまだ光っていない / 分からない",
          bubble: "生成後は、この質問に答えると次へ進みます。",
        },
      ];

      const statusText = document.querySelector("#statusText");
      const progress = document.querySelector("#progress");
      const runButton = document.querySelector("#runButton");
      const dot = document.querySelector("#dot");
      const helpButton = document.querySelector("#helpButton");
      const guideOverlay = document.querySelector("#guideOverlay");
      const guideCard = document.querySelector("#guideCard");
      const guideCursor = document.querySelector("#guideCursor");
      const guidePulse = document.querySelector("#guidePulse");
      const guideSpeech = document.querySelector("#guideSpeech");
      const guideCount = document.querySelector("#guideCount");
      const guideTitle = document.querySelector("#guideTitle");
      const guideText = document.querySelector("#guideText");
      const guideExample = document.querySelector("#guideExample");
      const guideCloseButton = document.querySelector("#guideCloseButton");
      const guidePrevButton = document.querySelector("#guidePrevButton");
      const guideNextButton = document.querySelector("#guideNextButton");
      const guideFillButton = document.querySelector("#guideFillButton");

      function setStatus(text, ready = false) {
        statusText.textContent = text;
        dot.classList.toggle("ready", ready);
      }

      function setProgress(text) {
        progress.textContent = text;
      }

      function startGuide() {
        state.guideStep = 0;
        guideOverlay.classList.remove("hidden");
        guideOverlay.setAttribute("aria-hidden", "false");
        showGuideStep();
      }

      function closeGuide() {
        clearGuideHighlight();
        guideOverlay.classList.add("hidden");
        guideOverlay.setAttribute("aria-hidden", "true");
      }

      function showGuideStep() {
        clearGuideHighlight();
        const step = GUIDE_STEPS[state.guideStep];
        const target = findGuideTarget(step);
        if (!target) {
          closeGuide();
          return;
        }

        target.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
        guideCount.textContent = `${state.guideStep + 1} / ${GUIDE_STEPS.length}`;
        guideTitle.textContent = step.title;
        guideText.textContent = step.text;
        guideExample.textContent = step.example;
        guideSpeech.textContent = step.bubble || step.title;
        guidePrevButton.disabled = state.guideStep === 0;
        guideNextButton.textContent = state.guideStep === GUIDE_STEPS.length - 1 ? "完了" : "次へ";
        guideFillButton.style.visibility = ["run", "answer"].includes(step.id) ? "hidden" : "visible";

        window.setTimeout(() => {
          target.classList.add("guide-highlight");
          state.activeGuideTarget = target;
          positionGuide(target);
        }, 240);
      }

      function findGuideTarget(step) {
        return document.querySelector(step.selector) || (step.fallback ? document.querySelector(step.fallback) : null);
      }

      function positionGuide(target) {
        const rect = target.getBoundingClientRect();
        const cursorX = clamp(rect.left + rect.width * 0.74, 20, window.innerWidth - 88);
        const cursorY = clamp(rect.top + rect.height * 0.46, 20, window.innerHeight - 106);
        guideCursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
        guidePulse.style.transform = `translate(${cursorX + 10}px, ${cursorY + 16}px)`;

        const speechWidth = Math.min(300, window.innerWidth - 32);
        let speechLeft = cursorX + 54;
        if (speechLeft + speechWidth > window.innerWidth - 16) {
          speechLeft = cursorX - speechWidth + 10;
        }
        speechLeft = clamp(speechLeft, 16, window.innerWidth - speechWidth - 16);
        let speechTop = cursorY - 76;
        speechTop = clamp(speechTop, 16, window.innerHeight - guideSpeech.offsetHeight - 16);
        guideSpeech.style.left = `${speechLeft}px`;
        guideSpeech.style.top = `${speechTop}px`;

        const cardWidth = Math.min(360, window.innerWidth - 32);
        let left = rect.right + 18;
        if (left + cardWidth > window.innerWidth - 16) {
          left = rect.left - cardWidth - 18;
        }
        left = clamp(left, 16, window.innerWidth - cardWidth - 16);

        let top = rect.top + rect.height / 2 - 118;
        top = clamp(top, 16, window.innerHeight - guideCard.offsetHeight - 16);
        guideCard.style.left = `${left}px`;
        guideCard.style.top = `${top}px`;
      }

      function clearGuideHighlight() {
        if (state.activeGuideTarget) {
          state.activeGuideTarget.classList.remove("guide-highlight");
          state.activeGuideTarget = null;
        }
      }

      function nextGuideStep() {
        if (state.guideStep >= GUIDE_STEPS.length - 1) {
          closeGuide();
          return;
        }
        state.guideStep += 1;
        showGuideStep();
      }

      function previousGuideStep() {
        if (state.guideStep <= 0) return;
        state.guideStep -= 1;
        showGuideStep();
      }

      function applyGuideExample() {
        const step = GUIDE_STEPS[state.guideStep];
        if (!step) return;
        if (step.id === "intent") {
          document.querySelector("#intent").value = step.example;
        } else if (step.id === "entry") {
          const chip = document.querySelector('#entryChips .chip[data-text="かわいいものを作りたい"]');
          chip?.click();
        } else if (step.id === "budget") {
          document.querySelector("#budget").value = "5000";
        } else if (step.id === "board") {
          document.querySelector("#board").value = "esp32";
        } else if (step.id === "inventory") {
          document.querySelector("#inventory").value = step.example;
        } else if (step.id === "stage") {
          document.querySelector("#stage").value = "orient";
        } else if (step.id === "symptom") {
          document.querySelector("#symptom").value = "none";
        }
        setProgress("入力例を入れました。内容は自由に書き換えられます。");
        showGuideStep();
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function requestPayload() {
        const text = document.querySelector("#intent").value.trim();
        const budget = document.querySelector("#budget").value;
        const board = document.querySelector("#board").value;
        const inventory = document.querySelector("#inventory").value.trim();
        const currentStage = document.querySelector("#stage").value;
        const symptom = document.querySelector("#symptom").value;
        return {
          text: `${text} ${state.selectedEntry}`,
          inventory,
          budget,
          board,
          currentStage,
          symptom,
          device: "cuda",
          topK: 3,
        };
      }

      async function postJson(url, body, timeoutMs = 45000) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const response = await fetch(`${API_BASE}${url}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal: controller.signal,
          });
          if (!response.ok) {
            throw new Error(`${url} ${response.status}`);
          }
          return await response.json();
        } finally {
          clearTimeout(timeout);
        }
      }

      function renderProjects(discover, tutorial) {
        const target = document.querySelector("#projects");
        let items = discover?.recommendations || [];
        if (!items.length && tutorial?.tutorial?.threeChoices) {
          items = tutorial.tutorial.threeChoices;
        }
        if (!items.length) {
          target.innerHTML = `<p class="empty">作品候補を取得できませんでした。</p>`;
          return;
        }
        target.innerHTML = items.slice(0, 3).map((item, index) => {
          const id = item.id || item.projectId || "";
          const title = PROJECT_LABELS[id] || item.title || item.name || `候補 ${index + 1}`;
          const summary = item.summary || item.description || item.reason || item.type || "";
          const cost = item.budgetRange || item.costRange || item.estimatedCost || item.budget || "";
          const difficulty = item.difficulty ? `難易度 ${item.difficulty}` : "";
          return `
            <article class="project-card">
              <h3>${escapeHtml(title)}</h3>
              <p class="subtitle">${escapeHtml(summary)}</p>
              <div class="meta">
                ${cost ? `<span class="pill good">${escapeHtml(String(cost))}</span>` : ""}
                ${difficulty ? `<span class="pill">${escapeHtml(String(difficulty))}</span>` : ""}
              </div>
            </article>
          `;
        }).join("");
      }

      function renderTutorial(result) {
        const target = document.querySelector("#tutorial");
        const tutorial = result?.tutorial;
        if (!tutorial) {
          target.textContent = "チュートリアルを生成できませんでした。";
          return;
        }
        const question = tutorial.nextQuestion || "今見えている状態を一言で教えてください。";
        state.latestQuestion = question;
        target.innerHTML = `
          <div class="meta">
            <span class="pill good">${escapeHtml(result.stage?.label || "")}</span>
            <span class="pill info">${escapeHtml(result.route?.label || "")}</span>
            <span class="pill">${escapeHtml(result.checkpoint?.label || "")}</span>
            <span class="pill">自走度 ${percent(result.autonomyScore)}</span>
          </div>
          <h3 style="margin-top:12px">${escapeHtml(tutorial.title)}</h3>
          <p class="subtitle">${escapeHtml(tutorial.teacherNote)}</p>
          <div class="kv">
            <div><span>次の一手</span><strong>${escapeHtml(tutorial.nextAction)}</strong></div>
            <div><span>次の質問</span><strong>${escapeHtml(tutorial.nextQuestion)}</strong></div>
            <div><span>期待する反応</span><strong>${escapeHtml(tutorial.expectedSignal)}</strong></div>
          </div>
          <div class="answer-panel">
            <span class="section-label">ここに答える</span>
            <p class="answer-question">${escapeHtml(question)}</p>
            <textarea id="answerBox" class="answer-box" placeholder="例: LEDはまだ光っていない / COMポートは見えている / 分からない"></textarea>
            <div class="answer-tools">
              <div class="answer-chips">
                <button class="chip small answer-chip" type="button" data-answer="はい">はい</button>
                <button class="chip small answer-chip" type="button" data-answer="いいえ">いいえ</button>
                <button class="chip small answer-chip" type="button" data-answer="分からない">分からない</button>
                <button class="chip small answer-chip" type="button" data-answer="写真で確認したい">写真で確認したい</button>
              </div>
              <button class="primary answer-submit" type="button" id="answerButton">回答して次へ</button>
            </div>
            <p class="hint">いま見えている状態をそのまま書けば大丈夫です。回答は左の「今の状態」に追記され、次の手順を作り直します。</p>
          </div>
          <ul>${(tutorial.checklist || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
          <div class="timeline">
            ${(tutorial.runbook || []).map((step) => `
              <div class="step">
                <div class="num">${step.step}</div>
                <div>
                  <strong>${escapeHtml(step.title)}</strong>
                  <p class="subtitle">${escapeHtml(step.goal)}</p>
                </div>
              </div>
            `).join("")}
          </div>
        `;
        wireTutorialAnswerControls();
      }

      function wireTutorialAnswerControls() {
        const box = document.querySelector("#answerBox");
        const button = document.querySelector("#answerButton");
        if (!box || !button) return;

        button.addEventListener("click", answerTutorialQuestion);
        box.addEventListener("keydown", (event) => {
          if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
            answerTutorialQuestion();
          }
        });
        document.querySelectorAll(".answer-chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            box.value = chip.dataset.answer || "";
            box.focus();
          });
        });
      }

      function answerTutorialQuestion() {
        const box = document.querySelector("#answerBox");
        const intent = document.querySelector("#intent");
        const stage = document.querySelector("#stage");
        const answer = box?.value.trim() || "";
        if (!answer) {
          setProgress("次の質問への答えを1行で入れてください。分からない場合は「分からない」で進められます。");
          box?.focus();
          return;
        }

        const question = state.latestQuestion || state.latest?.tutorial?.tutorial?.nextQuestion || "次の質問";
        const baseText = intent.value.trim();
        const addition = `次の質問: ${question}\n回答: ${answer}`;
        intent.value = baseText ? `${baseText}\n\n${addition}` : addition;
        stage.value = nextStageForAnswer(stage.value, answer);
        box.value = "";
        setProgress("回答を反映して、次の手順を生成しています。");
        run();
      }

      function nextStageForAnswer(currentStage, answer) {
        const normalized = answer.replace(/\s/g, "").toLowerCase();
        const needsDebug = ["いいえ", "no", "分からない", "わからない", "不明", "動かない", "エラー", "光らない", "鳴らない", "映らない", "止まる"].some((word) =>
          normalized.includes(word)
        );
        if (needsDebug) {
          if (currentStage === "orient") return "parts_check";
          if (currentStage === "parts_check") return "parts_check";
          return "debug_triage";
        }

        const order = ["orient", "parts_check", "minimal_circuit", "firmware_upload", "observe_serial", "standard_build", "extension"];
        const index = order.indexOf(currentStage);
        if (index < 0 || index >= order.length - 1) return currentStage;
        return order[index + 1];
      }

      function renderNeural(result) {
        const target = document.querySelector("#neural");
        const fw = result?.firmware;
        if (!fw) {
          target.textContent = "分類結果なし";
          return;
        }
        target.innerHTML = `
          <div class="meta">
            <span class="pill good">${escapeHtml(PROJECT_LABELS[fw.projectId] || fw.projectId)}</span>
            <span class="pill">${escapeHtml(fw.variant?.id || "")}</span>
            <span class="pill">${escapeHtml(fw.board?.label || "")}</span>
            <span class="pill">${escapeHtml(fw.pinProfile?.id || "")}</span>
          </div>
          <div class="kv">
            <div><span>project confidence</span><strong>${percent(fw.confidence)}</strong></div>
            <div><span>variant confidence</span><strong>${percent(fw.variant?.confidence)}</strong></div>
            <div><span>board confidence</span><strong>${percent(fw.board?.confidence)}</strong></div>
          </div>
        `;
      }

      function renderBom(result) {
        const target = document.querySelector("#bom");
        if (!result?.available) {
          target.textContent = "BOM推定なし";
          return;
        }
        const components = (result.components || []).slice(0, 5);
        target.innerHTML = `
          <div class="meta">
            <span class="pill good">${escapeHtml(result.estimatedCost?.range || "")}</span>
            <span class="pill">${escapeHtml(result.risk || "")}</span>
          </div>
          <div class="kv">
            ${components.map((item) => `<div><span>${escapeHtml(item.name)}</span><strong>${escapeHtml(item.priceRange || "")}</strong></div>`).join("")}
          </div>
        `;
      }

      function renderFirmware(result) {
        const meta = document.querySelector("#firmwareMeta");
        const code = document.querySelector("#code");
        const fw = result?.firmware || result;
        if (!fw?.code) {
          meta.textContent = "コードなし";
          code.textContent = "// 生成できませんでした";
          return;
        }
        meta.innerHTML = `
          <div class="meta">
            <span class="pill good">${escapeHtml(fw.language || "Arduino C++")}</span>
            <span class="pill">${escapeHtml(fw.generationMode || "")}</span>
            ${fw.staticChecks?.hasSerialDebug ? `<span class="pill good">Serial OK</span>` : `<span class="pill warn">Serial未確認</span>`}
          </div>
        `;
        code.textContent = fw.code;
      }

      function renderDebug(result) {
        const target = document.querySelector("#debug");
        const debug = result?.debug || result;
        const top = debug?.causeRanking?.[0];
        if (!top) {
          target.textContent = "診断なし";
          return;
        }
        target.innerHTML = `
          <div class="meta">
            <span class="pill warn">${escapeHtml(top.cause)}</span>
            <span class="pill">${percent(top.score)}</span>
          </div>
          <p class="subtitle">${escapeHtml(top.label || "")}</p>
          <div class="kv">
            <div><span>次の確認</span><strong>${escapeHtml(debug.nextQuestion || "")}</strong></div>
            <div><span>skill</span><strong>${escapeHtml(debug.skillUpdateHint || "")}</strong></div>
          </div>
        `;
      }

      function renderSafety(result) {
        const target = document.querySelector("#safety");
        const safety = result?.safety || result;
        const risk = safety?.risk || "unknown";
        const pillClass = risk === "blocked" ? "danger" : risk === "high" || risk === "medium" ? "warn" : "good";
        const labels = safety?.labels || [];
        target.innerHTML = `
          <div class="meta">
            <span class="pill ${pillClass}">${escapeHtml(risk)}</span>
            ${labels.slice(0, 3).map((item) => `<span class="pill">${escapeHtml(item.label)} ${percent(item.score)}</span>`).join("")}
          </div>
        `;
      }

      async function run() {
        runButton.disabled = true;
        setStatus("推論中", false);
        setProgress("作品候補を生成中");
        const payload = requestPayload();
        try {
          const discover = await postJson("/api/discover/intent", { ...payload, useTransformer: true }, 50000);
          const selectedProject = discover?.recommendations?.[0]?.id || "desk_pet";
          state.selectedProject = selectedProject;

          setProgress("自律チュートリアルを分類中");
          const tutorial = await postJson("/api/tutorial/next", {
            ...payload,
            projectId: selectedProject,
          }, 50000);
          renderProjects(discover, tutorial);
          renderTutorial(tutorial);

          const classifiedPayload = {
            ...payload,
            projectId: tutorial?.project?.id || selectedProject,
            text: `${payload.text} projectId ${tutorial?.project?.id || selectedProject} boardClass ${payload.board} pinProfile ${pinProfileFor(payload.board)} firmwareVariant ${variantFor(tutorial?.project?.id || selectedProject)}`,
          };

          setProgress("コード・安全・デバッグ分類を実行中");
          const neural = await postJson("/api/ai/neural-agents", classifiedPayload, 50000);
          renderNeural(neural);
          renderFirmware(neural);
          renderDebug(neural);
          renderSafety(neural);

          setProgress("部品と予算を推定中");
          const bom = await postJson("/api/ai/bom/estimator", {
            ...payload,
            projectId: tutorial?.project?.id || selectedProject,
            project: tutorial?.project?.title || payload.text,
            selectedOption: neural?.firmware?.variant?.id || "",
          }, 50000);
          renderBom(bom);

          state.latest = { discover, tutorial, neural, bom };
          setStatus("生成完了", true);
          setProgress("次の質問に答えると、チュートリアルが先へ進みます");
        } catch (error) {
          setStatus("エラー", false);
          setProgress(error.name === "AbortError" ? "推論がタイムアウトしました" : String(error.message || error));
        } finally {
          runButton.disabled = false;
        }
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function percent(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "";
        return `${Math.round(number * 100)}%`;
      }

      function variantFor(projectId) {
        const map = {
          light_charm: "light_charm_debug",
          desk_pet: "desk_pet_buzzer",
          plant_ping: "plant_ping_buzzer",
          posture_guard: "posture_guard_buzzer",
          temp_face: "temp_face_serial",
        };
        return map[projectId] || "desk_pet_buzzer";
      }

      function pinProfileFor(board) {
        const map = {
          arduino_uno: "arduino_default",
          esp32: "esp32_default",
          m5stack: "m5stack_grove",
          pico: "pico_default",
        };
        return map[board] || "esp32_default";
      }

      helpButton.addEventListener("click", startGuide);
      guideCloseButton.addEventListener("click", closeGuide);
      guidePrevButton.addEventListener("click", previousGuideStep);
      guideNextButton.addEventListener("click", nextGuideStep);
      guideFillButton.addEventListener("click", applyGuideExample);
      window.addEventListener("resize", () => {
        if (!guideOverlay.classList.contains("hidden") && state.activeGuideTarget) {
          positionGuide(state.activeGuideTarget);
        }
      });
      window.addEventListener("scroll", () => {
        if (!guideOverlay.classList.contains("hidden") && state.activeGuideTarget) {
          positionGuide(state.activeGuideTarget);
        }
      }, true);
      document.addEventListener("keydown", (event) => {
        if (guideOverlay.classList.contains("hidden")) return;
        if (event.key === "Escape") closeGuide();
        if (event.key === "ArrowRight") nextGuideStep();
        if (event.key === "ArrowLeft") previousGuideStep();
      });

      document.querySelector("#entryChips").addEventListener("click", (event) => {
        const button = event.target.closest(".chip");
        if (!button) return;
        document.querySelectorAll("#entryChips .chip").forEach((chip) => chip.classList.remove("active"));
        button.classList.add("active");
        state.selectedEntry = button.dataset.text || "";
      });

      runButton.addEventListener("click", run);
      run();
    </script>
  </body>
</html>
